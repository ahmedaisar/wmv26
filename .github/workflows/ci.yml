name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-quality:
    name: PR quality
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Assert server-only Supabase boundary
        run: |
          if grep -R -nE 'NEXT_PUBLIC_SUPABASE_(ANON|PUBLISHABLE)_KEY|@supabase/ssr|createSupabaseBrowserClient' src; then
            echo "Browser Supabase access or a public Supabase key was found."
            exit 1
          fi
          test ! -e src/lib/supabase/client.ts
          grep -q '^import "server-only";' src/lib/supabase/server.ts
          grep -q '^import "server-only";' src/lib/env.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
