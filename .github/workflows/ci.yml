name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npx --yes npm@11 install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Apply Supabase migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Start local Supabase
        run: npx --yes supabase@latest start --exclude studio,edge-runtime,logflare,vector

      - name: Apply migrations from a clean database
        run: npx --yes supabase@latest db reset

      - name: Run database policy and workflow tests
        run: npx --yes supabase@latest test db

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@latest stop --no-backup || true

  taste-design:
    name: Taste Skill art-direction deal
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/editorial-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run pinned Taste Skill deal
        env:
          TASTE_PALETTE: cool-white-slate
          TASTE_TYPE: reddit
          TASTE_MOMENT: '1'
        run: bash scripts/taste-deal.sh software saas

  taste-public-design:
    name: Taste Skill public editorial art-direction deal
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/public-editorial-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Deal the public publisher direction
        env:
          TASTE_MOMENT: '1'
        run: |
          bash scripts/taste-deal.sh service agency | tee /tmp/wmv-public-taste-deal.txt
          mkdir -p .taste-skill
          cp /tmp/wmv-public-taste-deal.txt .taste-skill/public-editorial-deal.txt

      - name: Upload dealt direction
        uses: actions/upload-artifact@v4
        with:
          name: taste-public-editorial-deal
          path: .taste-skill/public-editorial-deal.txt

  taste-editorial-ui-design:
    name: Taste Skill editorial workspace art-direction deal
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/editorial-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run pinned Taste Skill deal
        env:
          TASTE_SKIP_DEAL: '1'
          TASTE_PALETTE: white-link-blue
          TASTE_TYPE: geist
          TASTE_AXIS: wght
          TASTE_MOMENT: '1'
          TASTE_MOMENT_SEED: wmv26-editorial-7
        run: bash scripts/taste-deal.sh software saas

  taste-editorial-ui-browser-gate:
    name: Taste Skill browser gate (admin sign-in)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/editorial-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Fetch pinned Taste Skill scripts
        env:
          TASTE_SKIP_DEAL: '1'
          TASTE_PALETTE: white-link-blue
          TASTE_TYPE: geist
          TASTE_AXIS: wght
          TASTE_MOMENT: '1'
          TASTE_MOMENT_SEED: wmv26-editorial-7
        run: bash scripts/taste-deal.sh software saas

      - name: Install dependencies
        run: npx --yes npm@11 install --no-audit --no-fund

      - name: Start local Supabase
        run: npx --yes supabase@latest start --exclude studio,edge-runtime,logflare,vector,inbucket

      - name: Apply migrations
        run: npx --yes supabase@latest db reset

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(npx --yes supabase@latest status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Install Chromium for the Taste Skill gate
        run: npx --yes playwright install --with-deps chromium

      - name: Resolve Chrome binary
        shell: bash
        run: |
          CHROME_BINARY="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)"
          test -x "$CHROME_BINARY"
          CHROME_WRAPPER="$RUNNER_TEMP/chrome-ci"
          cat > "$CHROME_WRAPPER" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage "\$@"
          EOF
          chmod +x "$CHROME_WRAPPER"
          "$CHROME_WRAPPER" --headless=new --dump-dom about:blank >/tmp/chrome-smoke.html 2>/tmp/chrome-smoke.log || {
            cat /tmp/chrome-smoke.log
            exit 1
          }
          echo "CHROME_PATH=$CHROME_WRAPPER" >> "$GITHUB_ENV"

      - name: Build production app for the browser gate
        run: npm run build

      - name: Start the Next.js application
        shell: bash
        run: |
          npm run start > /tmp/wheresmaldives-next.log 2>&1 &
          echo "$!" > /tmp/wheresmaldives-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/admin/sign-in >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wheresmaldives-next.log
          exit 1

      - name: Run Taste Skill visual gate
        shell: bash
        run: |
          GATE=".taste-skill/source/skills/taste-skill/scripts/gate.mjs"
          node "$GATE" --start http://localhost:3000/admin/sign-in --kind software --category "Editorial CMS" --primary "Sign in" --profile .taste-skill/chrome
          node "$GATE" http://localhost:3000/admin/sign-in --kind software --category "Editorial CMS" --primary "Sign in" --profile .taste-skill/chrome

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@latest stop --no-backup || true
